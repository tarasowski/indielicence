name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Swift tests (library, CLI, shared vectors)
        run: swift test

      - name: JS verifier against shared vectors
        run: node --test Tests/verify.test.mjs

      - name: Vectors are reproducible from the generator
        run: |
          node Tools/make-vectors.mjs > /tmp/vectors.json
          diff Tests/vectors.json /tmp/vectors.json

      - name: End-to-end demo
        run: Examples/demo.sh

      - name: No network calls outside the opt-in feedback view
        # The verifiers, the CLI, and every template except the endpoint-mode
        # LicenseFeedbackView must stay free of networking symbols. That view
        # is the single sanctioned exception: its one request is composed by
        # the user and sent only when they press Send.
        run: |
          ! rg -n -g '*.swift' -g '*.mjs' \
            'URLSession|NSURLConnection|CFNetwork|import Network|NW(Connection|Listener|Path)|node:(http|https|net|tls|dgram|dns)|\b(fetch|WebSocket|socket|connect|getaddrinfo)\s*\(|\b(curl|wget)\b' \
            Sources Verifier
          ! rg -n -g '*.template' -g '!LicenseFeedbackView.swift.template' \
            'URLSession|NSURLConnection|CFNetwork|import Network|NW(Connection|Listener|Path)|\b(fetch|WebSocket|socket|connect|getaddrinfo)\s*\(' \
            Templates
